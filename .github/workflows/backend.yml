name: Backend tests
# backend/가 바뀐 PR과 main·feature/backend 푸시에서, 실제 PostgreSQL로 마이그레이션 확인과 전체 테스트를 돌린다.
# 비밀값은 필요 없다(서울시 API와 AI는 테스트에서 가짜를 쓴다).
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main, 'feature/backend']
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cycleon
          POSTGRES_PASSWORD: cycleon-ci
          POSTGRES_DB: cycleon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cycleon -d cycleon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: postgresql+asyncpg://cycleon:cycleon-ci@127.0.0.1:5432/cycleon_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply migrations and check models match them
        # DATABASE_URL은 이 단계에만 준다. pytest 단계에 있으면 'DB 없음' 테스트가 이 값을 읽어 버린다.
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: |
          alembic upgrade head
          alembic check
      - name: Run tests (DB tests must not be skipped)
        env:
          TEST_DATABASE_URL: ${{ env.DB_URL }}
          CYCLEON_REQUIRE_TEST_DB: '1'
        run: pytest -q -rs
