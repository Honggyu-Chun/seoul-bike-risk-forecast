name: CycleOn API contract
on:
  pull_request:
    paths: ['모델개발/cycleon/**', '모델개발/docs/cycleon/**', '모델개발/docs/cycleon_*openapi.json', '모델개발/scripts/cycleon_*', '모델개발/requirements-contract.txt', '.github/workflows/cycleon-contract.yml', 'SETUP_CYCLEON_MOCK.cmd', 'RUN_CYCLEON_MOCK.cmd']
  push:
    branches: [main, 'docs/model-api-handoff']
    paths: ['모델개발/cycleon/**', '모델개발/docs/cycleon/**', '모델개발/docs/cycleon_*openapi.json', '모델개발/scripts/cycleon_*', '모델개발/requirements-contract.txt', '.github/workflows/cycleon-contract.yml', 'SETUP_CYCLEON_MOCK.cmd', 'RUN_CYCLEON_MOCK.cmd']
permissions:
  contents: read
jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/cycleon_setup.py
        working-directory: 모델개발
      - run: .venv-contract/bin/python scripts/cycleon_mock_smoke.py
        if: runner.os != 'Windows'
        working-directory: 모델개발
      - run: .\.venv-contract\Scripts\python.exe scripts/cycleon_mock_smoke.py
        if: runner.os == 'Windows'
        working-directory: 모델개발
