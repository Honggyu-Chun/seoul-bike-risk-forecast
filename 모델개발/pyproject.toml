[project]
name = "p-project-data-audit"
version = "0.1.0"
description = "Seoul bike availability forecasting, reproducible evaluation, and rider web demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pyarrow>=18,<24",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
    "pytest>=8,<9",
    "python-docx>=1.1,<2",
]
research = [
    "catboost>=1.2,<2",
    "torch==2.6.0+cpu",
    "xgboost-cpu>=3,<4",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

